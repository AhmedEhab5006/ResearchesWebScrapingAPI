name: Django Service CI/CD

on:
  push:
    branches: [DeployTesy]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & Push Django
        run: |
          TAG=${GITHUB_SHA}
          docker build -t ghcr.io/${{ github.repository_owner }}/django-service:$TAG ./ResearchesWebScrapingAPI
          docker push ghcr.io/${{ github.repository_owner }}/django-service:$TAG

      - name: Build & Push Celery Worker
        run: |
          TAG=${GITHUB_SHA}
          docker build -t ghcr.io/${{ github.repository_owner }}/celery-worker:$TAG ./ResearchesWebScrapingAPI
          docker push ghcr.io/${{ github.repository_owner }}/celery-worker:$TAG