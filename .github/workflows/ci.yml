name: Django Service CI/CD

on:
  push:
    branches: [DeployTesy] 

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Django
        run: |
          TAG=${GITHUB_SHA}
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${REPO}/django-service:${TAG}
          docker build -t $IMAGE -f ./ResearchesWebScrapingAPI/Dockerfile .
          docker push $IMAGE